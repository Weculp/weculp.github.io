<html lang="en" data-side="ra">
<head>

<script>
  // pick the side before first paint so the page never flashes the wrong colour
  try { const s = localStorage.getItem("onlinevpn-side"); if (s === "g" || s === "ra") document.documentElement.dataset.side = s; } catch (e) {}

<style>
  :root {
    --void: #030305;
    --panel: rgba(9, 10, 14, 0.78);
    --ink: #e8ecf1;
    --ink-dim: #8a929e;
    --ink-faint: #3a3f48;
    --display: "Oxanium", "Segoe UI", sans-serif;
    --mono: "Share Tech Mono", ui-monospace, Consolas, monospace;
    --cut: 18px;
    --gutter: clamp(16px, 4vw, 56px);
  }
  /* Ra — the red circuitry */
  [data-side="ra"] {
    --hot: #ff2635;
    --hot-deep: #8f0a14;
    --hot-glow: rgba(255, 38, 53, 0.55);
    --hot-soft: rgba(255, 38, 53, 0.12);
    --cold: #23b8ff;
  }
  /* G — the blue one */
  [data-side="g"] {
    --hot: #23b8ff;
    --hot-deep: #0a4d8f;
    --hot-glow: rgba(35, 184, 255, 0.55);
    --hot-soft: rgba(35, 184, 255, 0.12);
    --cold: #ff2635;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--display);
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    position: relative;
  }
  ::selection { background: var(--hot); color: var(--void); }
  a { color: inherit; text-decoration: none; }

  /* ---------- backdrop: grid, circuitry, core, scanlines ---------- */
  .grid-floor {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 50%, var(--hot-soft), transparent 70%),
      linear-gradient(transparent 0 calc(100% - 1px), rgba(255,255,255,0.035) 0) 0 0 / 100% 48px,
      linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255,255,255,0.035) 0) 0 0 / 48px 100%;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, #000 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, #000 30%, transparent 85%);
    transition: background 0.6s;
  }
  svg.circuits {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
  }
  .circuits .trace {
    fill: none; stroke: var(--hot); stroke-width: 1.4; opacity: 0.32;
    stroke-linecap: square; stroke-linejoin: miter;
    transition: stroke 0.6s;
  }
  .circuits .pulse {
    fill: none; stroke: var(--hot); stroke-width: 2.4; stroke-linecap: round;
    stroke-dasharray: 70 2400;
    filter: drop-shadow(0 0 4px var(--hot)) drop-shadow(0 0 10px var(--hot-glow));
    animation: run var(--dur, 6s) linear infinite;
    animation-delay: var(--delay, 0s);
    transition: stroke 0.6s;
  }
  .circuits .node {
    fill: var(--void); stroke: var(--hot); stroke-width: 1.6; opacity: 0.8;
    transition: stroke 0.6s;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes run { from { stroke-dashoffset: 2470; } to { stroke-dashoffset: 0; } }

  /* ---------- H.A.R.T. — the heart unit ---------- */
  .hart {
    position: relative; z-index: 2;
    width: clamp(260px, 28vw, 420px); aspect-ratio: 1;
    justify-self: center;
    animation: power-up 1.8s cubic-bezier(.2,.8,.2,1) both;
  }
  .hart .halo {
    position: absolute; left: 50%; top: 50%; z-index: -1; pointer-events: none;
    width: 250%; height: 250%; transform: translate(-50%, -50%); overflow: visible;
  }
  .halo .ring { fill: none; stroke: var(--hot); transition: stroke 0.6s; transform-origin: 300px 300px; }
  .halo .r1 { stroke-width: 1; opacity: 0.16; stroke-dasharray: 2 10; animation: spin 90s linear infinite; }
  .halo .r2 { stroke-width: 1.5; opacity: 0.26; stroke-dasharray: 140 40 20 40; animation: spin 40s linear infinite reverse; }
  .halo .r3 { stroke-width: 5; opacity: 0.14; stroke-dasharray: 3 9; animation: spin 60s linear infinite; }
  .halo .bloom { fill: url(#bloom); animation: breathe 2.4s ease-in-out infinite; transform-origin: 300px 300px; }

  .hart .unit {
    position: relative; width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 0 14px var(--hot-glow)) drop-shadow(0 0 48px var(--hot-soft));
    transition: filter 0.4s;
  }
  .unit .spin-slow { transform-origin: 200px 200px; animation: spin 48s linear infinite; }
  .unit .spin-rev { transform-origin: 200px 200px; animation: spin 16s linear infinite reverse; }
  .unit .spin-fast { transform-origin: 200px 200px; animation: spin 7s linear infinite; }
  .unit .bezel { fill: url(#bezel); stroke: rgba(255,255,255,0.10); stroke-width: 1; }
  .unit .lip { fill: #050609; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
  .unit .bolt { fill: url(#boltGrad); stroke: #08090c; stroke-width: 1; }
  .unit .ticks { fill: none; stroke: var(--hot); stroke-width: 4; stroke-dasharray: 1.5 6.3; opacity: 0.75; }
  .unit .coil-glow {
    fill: none; stroke: var(--hot); stroke-width: 54; opacity: 0.95;
    animation: breathe 2.4s ease-in-out infinite; transform-origin: 200px 200px;
  }
  .unit .coil { fill: url(#coilGrad); stroke: var(--hot); stroke-width: 1.1; stroke-opacity: 0.85; }
  .unit .winding { stroke: rgba(255,255,255,0.10); stroke-width: 1; }
  .unit .inner { fill: #040507; stroke: var(--hot); stroke-width: 3; }
  .unit .tri { fill: none; stroke: var(--hot); stroke-width: 2; opacity: 0.9; stroke-linejoin: miter; }
  .unit .tri.ghost { opacity: 0.3; stroke-width: 1; }
  .unit .dash { fill: none; stroke: var(--hot); stroke-width: 1.5; stroke-dasharray: 24 10 4 10; opacity: 0.8; }
  .unit .core { fill: url(#coreGrad); animation: beat 2.4s ease-in-out infinite; transform-origin: 200px 200px; }
  .unit .lens { fill: #fff; }
  .unit .hot-stroke, .unit .coil, .unit .ticks, .unit .inner, .unit .tri, .unit .dash, .unit .coil-glow { transition: stroke 0.6s; }

  /* the unit charges up while you type, and spins up when you jack in */
  body:has(.field:focus-within) .hart .unit {
    filter: drop-shadow(0 0 22px var(--hot-glow)) drop-shadow(0 0 80px var(--hot-glow));
  }
  body:has(.field:focus-within) .unit .spin-fast,
  .charging .unit .spin-fast { animation-duration: 1.6s; }
  .charging .unit .spin-rev { animation-duration: 3s; }
  .charging .unit .core { animation-duration: 0.6s; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.12); }
    24% { transform: scale(1); }
    36% { transform: scale(1.07); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; }
    12% { opacity: 1; }
    24% { opacity: 0.75; }
    36% { opacity: 0.95; }
  }
  @keyframes power-up {
    0% { opacity: 0; transform: scale(0.86) rotate(-25deg); filter: brightness(3); }
    35% { opacity: 1; }
    48% { opacity: 0.35; }
    58% { opacity: 1; }
    66% { opacity: 0.6; }
    100% { opacity: 1; transform: none; filter: none; }
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%);
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 20px var(--gutter);
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .back { color: var(--ink-dim); display: inline-flex; align-items: center; gap: 0.6rem; transition: color 0.2s; }
  .back:hover { color: var(--hot); }
  .back .chev { color: var(--hot); }

  .sides {
    display: inline-flex; align-items: center; gap: 0.7rem; color: var(--ink-dim);
  }
  .side-switch {
    display: inline-flex; border: 1px solid var(--ink-faint);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .side-switch button {
    font: inherit; letter-spacing: 0.14em; cursor: pointer;
    background: transparent; color: var(--ink-dim); border: 0;
    padding: 7px 14px; transition: background 0.25s, color 0.25s;
  }
  .side-switch button[aria-pressed="true"] { background: var(--hot); color: var(--void); }
  .side-switch button:focus-visible { outline: 1px solid var(--ink); outline-offset: -3px; }

  /* ---------- stage ---------- */
  main {
    position: relative; z-index: 5;
    min-height: calc(100svh - 80px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 400px);
    align-items: center;
    gap: clamp(24px, 4vw, 72px);
    padding: clamp(16px, 4vh, 48px) var(--gutter) clamp(40px, 8vh, 80px);
    max-width: 1480px; margin: 0 auto;
    overflow-x: clip; /* the H.A.R.T. halo is wider than a phone */
  }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); justify-items: center; min-height: 0; gap: 36px; }
    main > section { text-align: center; }
    .kicker { justify-content: center; }
    .hart { order: -1; width: min(64vw, 320px); margin-top: 24px; }
    .panel { width: 100%; max-width: 430px; }
  }

  .kicker {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--hot); display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.4rem;
  }
  .kicker::before {
    content: ""; width: 34px; height: 2px; background: var(--hot);
    box-shadow: 0 0 10px var(--hot-glow);
  }

  h1 {
    font-weight: 800; text-transform: uppercase;
    font-size: clamp(3.4rem, 6.6vw, 7rem);
    line-height: 0.86; letter-spacing: -0.015em;
    margin-bottom: 1.8rem;
  }
  h1 .line { display: block; }
  h1 .solid { text-shadow: 0 0 28px var(--hot-soft); }
  h1 .hollow {
    color: transparent;
    -webkit-text-stroke: 2px var(--hot);
    filter: drop-shadow(0 0 14px var(--hot-glow));
    position: relative;
  }
  h1 .hollow::after {
    /* occasional glitch slice */
    content: attr(data-text);
    position: absolute; left: 0; top: 0;
    color: var(--cold); -webkit-text-stroke: 0;
    clip-path: inset(0 0 100% 0);
    animation: glitch 7s steps(1) infinite;
    mix-blend-mode: screen; opacity: 0.85;
  }
  @keyframes glitch {
    0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    92% { clip-path: inset(18% 0 62% 0); transform: translateX(-6px); }
    94% { clip-path: inset(58% 0 22% 0); transform: translateX(5px); }
    96% { clip-path: inset(36% 0 48% 0); transform: translateX(-3px); }
  }

  /* ---------- auth panel ---------- */
  .panel {
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    padding: 2px;
  }
  .panel::before {
    /* hairline frame that follows the cut corners */
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(160deg, var(--hot), var(--ink-faint) 30%, var(--ink-faint) 70%, var(--hot));
    clip-path: inherit;
  }
  .panel-inner {
    background: rgba(6, 7, 10, 0.94);
    clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px));
    padding: 0 0 26px;
  }
  .panel-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 22px 12px 30px;
    border-bottom: 1px solid var(--ink-faint);
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim);
  }
  .panel-bar .tag { color: var(--void); background: var(--hot); padding: 2px 8px; letter-spacing: 0.16em; }

  .console {
    font-family: var(--mono); font-size: 0.8rem; line-height: 1.75; color: var(--ink-dim);
    padding: 16px 26px 4px; min-height: 5.6em;
  }
  .console .ok { color: var(--hot); }
  .console .caret {
    display: inline-block; width: 0.6em; height: 1em; background: var(--hot); vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }

  .panel-body { padding: 8px 26px 0; }
  .state[hidden], .notice[hidden] { display: none; }
  .panel h2 {
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
    font-size: 1.7rem; line-height: 1; margin: 6px 0 22px;
  }
  .panel h2 span { color: var(--hot); }

  .field { position: relative; margin-bottom: 20px; }
  .field label {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 6px;
  }
  .field label .idx { color: var(--ink-faint); }
  .field input {
    width: 100%; font: 500 1.08rem var(--display); letter-spacing: 0.04em; color: var(--ink);
    background: rgba(255,255,255,0.025);
    border: 0; border-bottom: 1px solid var(--ink-faint);
    padding: 12px 12px 10px;
    outline: none; border-radius: 0;
    transition: border-color 0.2s, background 0.2s;
  }
  .field::after {
    /* charge bar that fills on focus */
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0;
    background: var(--hot); box-shadow: 0 0 12px var(--hot-glow);
    transition: width 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .field:focus-within::after { width: 100%; }
  .field input:focus { background: var(--hot-soft); }
  .field input:-webkit-autofill {
    -webkit-text-fill-color: var(--ink);
    -webkit-box-shadow: 0 0 0 100px #0d0f14 inset;
    caret-color: var(--ink);
  }

  .btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    font: 800 1.05rem var(--display); letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--void); background: var(--hot); border: 0; cursor: pointer;
    padding: 16px 20px; margin-top: 8px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: box-shadow 0.25s, filter 0.25s;
  }
  .btn::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:hover::after { animation: sweep 0.7s ease; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .btn .arrow { font-family: var(--mono); font-size: 1.2rem; letter-spacing: 0; }
  @keyframes sweep { to { left: 130%; } }
  .btn.ghost {
    background: transparent; color: var(--ink); font-weight: 600; font-size: 0.85rem;
    box-shadow: inset 0 0 0 1px var(--ink-faint);
  }
  .btn.ghost:hover { color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); filter: none; }

  .notice {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 12px; margin-bottom: 18px;
    border-left: 3px solid var(--ink-dim); background: rgba(255,255,255,0.03); color: var(--ink-dim);
  }
  .notice.error { border-left-color: #ff2635; color: #ff6b75; background: rgba(255, 38, 53, 0.08); animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .circuits .pulse { display: none; }
  }
</style>
</head>

          <h2>Player <span>online</span></h2>
          <a class="btn" href="https://vpn.vikalpthukral.com/"><span>Resume game</span><span class="arrow">▸▸</span></a>
          <form method="post" action="https://vpn.vikalpthukral.com/_auth/logout">
            <button class="btn ghost" type="submit"><span>Log out</span><span class="arrow">✕</span></button>
          </form>
        </div>
      </div>
    </div>
  </aside>
</main>

<script>
  const root = document.documentElement;

  // ---- side switch: Ra (red) / G (blue) ----
  const buttons = document.querySelectorAll(".side-switch button");
  function setSide(side) {
    root.dataset.side = side;
    buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.set === side)));
    try { localStorage.setItem("onlinevpn-side", side); } catch (e) {}
  }
  buttons.forEach((b) => b.addEventListener("click", () => setSide(b.dataset.set)));
  setSide(root.dataset.side);

  // ---- circuitry: hand-routed traces, each with a travelling pulse ----
  const routes = [
    "M0 140 H260 L330 210 H520 L560 250 V330",
    "M0 380 H120 L170 430 V540",
    "M0 620 H180 L250 550 H420",
    "M0 860 H300 L380 780 H640 L700 840 V1000",
    "M420 0 V80 L470 130 H700",
    "M1600 120 H1350 L1290 180 H1120 L1080 140 V0",
    "M1600 470 H1460 L1400 530 H1280",
    "M1600 660 H1520 L1480 700 V780",
    "M1600 820 H1420 L1340 900 H1100 L1060 860",
    "M900 1000 V930 L950 880 H1180",
    "M1180 0 V60 L1230 110 H1400 L1440 70",
  ];
  const ns = "http://www.w3.org/2000/svg";
  const g = document.getElementById("traces");
  routes.forEach((d, i) => {
    const trace = document.createElementNS(ns, "path");
    trace.setAttribute("d", d);
    trace.setAttribute("class", "trace");
    g.appendChild(trace);
    const pulse = trace.cloneNode();
    pulse.setAttribute("class", "pulse");
    pulse.style.setProperty("--dur", (4.5 + (i * 1.7) % 5).toFixed(1) + "s");
    pulse.style.setProperty("--delay", (-(i * 2.3) % 6).toFixed(1) + "s");
    g.appendChild(pulse);
    // terminal pad at the inner end of every trace
    const pt = trace.getPointAtLength(trace.getTotalLength());
    const node = document.createElementNS(ns, "circle");
    node.setAttribute("cx", pt.x); node.setAttribute("cy", pt.y); node.setAttribute("r", 5);
    node.setAttribute("class", "node");
    g.appendChild(node);
  });

  // ---- H.A.R.T.: coil segments and housing bolts ----
  const polar = (r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [(200 + r * Math.cos(a)).toFixed(2), (200 + r * Math.sin(a)).toFixed(2)];
  };
  const coils = document.getElementById("coils");
  const SEGMENTS = 10, GAP = 7, R_IN = 104, R_OUT = 152;
  for (let i = 0; i < SEGMENTS; i++) {
    const a0 = i * (360 / SEGMENTS) + GAP / 2, a1 = (i + 1) * (360 / SEGMENTS) - GAP / 2;
    const [x0, y0] = polar(R_OUT, a0), [x1, y1] = polar(R_OUT, a1);
    const [x2, y2] = polar(R_IN, a1), [x3, y3] = polar(R_IN, a0);
    const seg = document.createElementNS(ns, "path");
    seg.setAttribute("class", "coil");
    seg.setAttribute("d", `M${x0} ${y0} A${R_OUT} ${R_OUT} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${R_IN} ${R_IN} 0 0 0 ${x3} ${y3} Z`);
    coils.appendChild(seg);
    // copper-winding grooves across each segment
    for (let k = 1; k < 6; k++) {
      const a = a0 + (a1 - a0) * k / 6;
      const [wx0, wy0] = polar(R_IN + 6, a), [wx1, wy1] = polar(R_OUT - 6, a);
      const w = document.createElementNS(ns, "line");
      w.setAttribute("class", "winding");
      w.setAttribute("x1", wx0); w.setAttribute("y1", wy0); w.setAttribute("x2", wx1); w.setAttribute("y2", wy1);
      coils.appendChild(w);
    }
  }
  const bolts = document.getElementById("bolts");
  for (let i = 0; i < 12; i++) {
    const [bx, by] = polar(183, i * 30 + 15);
    const b = document.createElementNS(ns, "circle");
    b.setAttribute("class", "bolt");
    b.setAttribute("cx", bx); b.setAttribute("cy", by); b.setAttribute("r", 5.5);
    bolts.appendChild(b);
  }
  document.querySelector("#stateLogin form").addEventListener("submit", () => root.classList.add("charging"));

  // ---- boot console ----
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = [
    ["> handshake ............ ", "ok"],
    ["> awaiting player", ""],
  ];
  const con = document.getElementById("console");
  function renderConsole(upTo, partial) {
    con.innerHTML = lines.slice(0, upTo).map(([t, s]) => t + (s ? '<span class="ok">' + s + "</span>" : "")).join("<br>")
      + (partial !== undefined ? (upTo ? "<br>" : "") + partial : "")
      + ' <span class="caret"></span>';
  }
  if (reduce) {
    renderConsole(lines.length);
  } else {
    let li = 0, ci = 0;
    (function type() {
      if (li >= lines.length) return renderConsole(lines.length);
      const full = lines[li][0];
      if (ci <= full.length) { renderConsole(li, full.slice(0, ci)); ci += 2; setTimeout(type, 18); }
      else { li++; ci = 0; setTimeout(type, 160); }
    })();
  }

  // ---- messages from the auth server (?error= / ?signed_out=) ----
  const params = new URLSearchParams(location.search);
  const errors = {
    invalid: "Access denied · wrong username or password",
    locked: "Lockout · too many attempts, retry in 15 min",
  };
  const err = params.get("error");
  if (err) {
    const el = document.getElementById("noticeError");
    el.textContent = errors[err] || "Access denied";
    el.hidden = false;
  }
  if (params.has("signed_out")) {
    const el = document.getElementById("noticeInfo");
    el.textContent = "Session terminated";
    el.hidden = false;
  }
  if (params.toString()) history.replaceState(null, "", location.pathname);

  // ---- already signed in? swap the form for "resume" ----
  fetch("https://vpn.vikalpthukral.com/_auth/status", { credentials: "include" })
    .then((r) => r.json())
    .then((s) => {
      if (!s.signedIn) return;
      document.getElementById("stateLogin").hidden = true;
      document.getElementById("stateSignedIn").hidden = false;
      document.querySelector(".panel-bar .tag").textContent = "Online";
    })
    .catch(() => {});
</script>

</body>
</html>
